services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: motivation_calendar_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motivation_calendar_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/motivation_calendar_test
      JWT_SECRET: test-secret
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
