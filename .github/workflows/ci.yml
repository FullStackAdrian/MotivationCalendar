name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NODE_ENV: test
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/motivation_calendar_test
  JWT_SECRET: test-secret
  ALLOWED_ORIGINS: http://localhost:3000

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: motivation_calendar_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d motivation_calendar_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and syntax checks
        run: npm run lint
      - name: Repository security configuration checks
        run: node scripts/security-check.js
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Frontend smoke tests
        run: npm run test:frontend
      - name: Coverage
        run: npm run test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: |
            coverage/
          if-no-files-found: warn
      - name: Security audit
        run: npm audit --audit-level=high

  unit-hermetic:
    name: Unit hermeticity (no DB)
    runs-on: ubuntu-latest
    # Sin services.postgres a propósito: la suite unit debe ser verde sin BD (A.5).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests without database
        run: npm run test:unit
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:59999/motivation_calendar_test
          JWT_SECRET: test-secret
          ALLOWED_ORIGINS: http://localhost:3000

  frontend-expo:
    name: Expo / Metro frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Expo dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: TDD unit and component tests
        run: npx jest --runInBand --reporters=default --reporters=./debug-reporter.js 2>&1 | tee /tmp/jest-full.log; echo "JEST_PIPE_EXIT:${PIPESTATUS[0]}"
      - name: Expose jest failures (debug temporal)
        if: always()
        run: |
          echo "=== SUMMARY ==="; grep -aE "^(FAIL|Tests:|Test Suites:|Snapshots:)" /tmp/jest-full.log | head -30 || true
          echo "=== TAIL ==="; tail -c 2500 /tmp/jest-full.log || true
          echo "=== REPORTER FILE ==="; cat /tmp/jest-failures.txt 2>/dev/null || echo "no failures file"
          SUM=$(grep -aE "^(FAIL|Tests:|Test Suites:)" /tmp/jest-full.log | tr '\n' ';' | cut -c1-3000)
          echo "::warning::SUMMARY::$SUM"
          TAIL2=$(tail -c 1500 /tmp/jest-full.log | tr -d '\000' | tr '\n' ' ' | cut -c1-3000)
          echo "::warning::TAIL::$TAIL2"
          HEAD1=$(head -c 2500 /tmp/jest-full.log | tr -d '\000' | tr '\n' ' ' | cut -c1-2500)
          echo "::warning::HEAD::$HEAD1"
          echo "::warning::ENV::node:$(node --version) npm:$(npm --version) platform:$(uname -a | cut -c1-200)"
          ERRS=$(grep -a -A8 "torn down" /tmp/jest-full.log | head -40 | tr -d '\000' | tr '\n' ' ' | cut -c1-2500)
          echo "::warning::ERRORS::$ERRS"
      - name: Coverage
        run: npm run test:coverage
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
      - name: Metro web export
        run: npm run export:web
