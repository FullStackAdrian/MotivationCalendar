name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '22'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-frontend:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Expo dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Export Expo web app
        working-directory: frontend
        run: npm run export:web
        env:
          # Requerido: sin esto el export hornea el fallback http://localhost:3000.
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}

      - name: Require the API URL secret
        # Falla cerrado en vez de desplegar un frontend que apunta a localhost.
        run: test -n "${{ secrets.EXPO_PUBLIC_API_URL }}"

      - name: Validate Expo web export
        run: |
          test -f frontend/dist/index.html
          test -d frontend/dist/_expo
          grep -q '_expo' frontend/dist/index.html

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  backend-artifact:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile backend
        run: npm run build

      - name: Build backend artifact
        run: tar -czf backend-deploy.tar.gz backend/dist package.json package-lock.json

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy
          path: backend-deploy.tar.gz
          retention-days: 5
