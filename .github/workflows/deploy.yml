name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-frontend:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend (if build script exists)
        run: npm run build --if-present
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Archive backend
        run: |
          tar -czf backend.tar.gz backend/
      
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-deploy
          path: backend.tar.gz
          retention-days: 5

      - name: Deploy notification
        run: |
          echo "✅ Backend ready for deployment"
          echo "📦 Backend artifact uploaded successfully"
          echo ""
          echo "Next steps:"
          echo "1. Download the backend-deploy artifact from GitHub Actions"
          echo "2. Deploy to your preferred hosting service (Railway, Render, Heroku, etc.)"
          echo "3. Update GITHUB_PAGES_API_URL in frontend/assets/js/api-client.js with your backend URL"
          echo "4. Commit and push changes to update GitHub Pages"

